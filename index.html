<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Descontos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de Descontos</h1>
        <label for="valorCompra">Valor da compra (R$):</label>
        <input type="number" id="valorCompra" placeholder="Digite o valor da compra" min="0" step="0.01">
        <button onclick="calcularDesconto()">Calcular desconto</button>
        <div id="resultado">
            <p>O resultado aparecerá aqui.</p>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
